            mkdir -p /tmp/lambda
            set +o pipefail 2>/dev/null; diff <(seq 1 636508) <(seq 1 636508) 2>/dev/null; md5sum < <(seq 1 636508) > /tmp/lambda/5; true
            set -- "edge-v9" "/tmp/lambda/5" "$(wc -c </tmp/lambda/5)"; echo "n=$1 p=$2 b=$3"
      - persist_to_workspace:
          root: /tmp/lambda
          paths:
            - '5'
  edge-v9:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
